name: Android Competitiveness QA

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Gameplay contracts
        run: npm run check:gameplay-contracts

      - name: Build WebView bundle
        run: npm run build:webview

      - name: Verify WebView bundle
        run: npm run verify:webview-bundle

      - name: Visual QA gate
        run: npm run qa:visual

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-competitiveness-qa
          path: output/
          if-no-files-found: ignore
